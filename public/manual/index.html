<script>
'use strict';
const DATA=JSON.parse(document.getElementById('data').textContent);
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LEAGUES=[...DATA.leagues,{id:'nba-drafts',sport:'NBA',platform:'待补充',players:[],draftOnly:true}];
const KEY='league-desk-v1';let saved={done:{},custom:[]};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&typeof s.done==='object'&&s.done&&!Array.isArray(s.done)&&Array.isArray(s.custom))saved={done:s.done,custom:s.custom.filter(t=>t&&typeof t.title==='string'&&LEAGUES.some(l=>l.id===t.league)&&Number.isFinite(Date.parse(t.time)))};}catch{}
let activeLeague='all',tab='tasks',now=new Date(),visibleTasks=[];
const title=l=>l.draftOnly?'NBA · 选秀':`${l.sport} · ${l.platform}`;
const league=id=>LEAGUES.find(l=>l.id===id);
const dateKey=(d,zone='Asia/Shanghai')=>new Intl.DateTimeFormat('en-CA',{timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date(d));
const fmt=(d,opt)=>new Intl.DateTimeFormat('zh-CN',{timeZone:'Asia/Shanghai',...opt}).format(new Date(d));
const clock=d=>fmt(d,{hour:'2-digit',minute:'2-digit',hour12:false});
const dayLabel=d=>fmt(d,{month:'long',day:'numeric',weekday:'long'});
const plus=(d,ms)=>new Date(+new Date(d)+ms).toISOString();
const matches=(f,l)=>l.players.filter(p=>p.team===f.home||p.team===f.away);
function selectedLeagues(){return LEAGUES.filter(l=>(activeLeague==='all'||l.id===activeLeague)&&($('platform').value==='all'||l.platform===$('platform').value));}
function timeFilter(t){const range=$('range').value;if(range==='all')return true;if(!t)return range==='past';const day=dateKey(t),today=dateKey(now);if(range==='today')return day===today;if(range==='tomorrow')return day===dateKey(plus(now,86400000));if(range==='week')return new Date(t)>=now&&new Date(t)<new Date(+now+7*86400000);return new Date(t)<now;}
function searchMatch(s){return s.toLowerCase().includes($('search').value.trim().toLowerCase());}
function countdown(t){const diff=new Date(t)-now;if(diff<0)return '已到时间';const m=Math.ceil(diff/60000);if(m<60)return `${m} 分钟后`;if(m<1440)return `${Math.floor(m/60)} 小时 ${m%60} 分后`;return `${Math.floor(m/1440)} 天 ${Math.floor(m%1440/60)} 小时后`;}
function pacificMidnight(date){let utc=Date.parse(date+'T00:00:00Z');for(let n=0;n<3;n++){const parts=new Intl.DateTimeFormat('en-US',{timeZone:'America/Los_Angeles',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date(utc));const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));const displayed=Date.UTC(+o.year,+o.month-1,+o.day,+o.hour,+o.minute,+o.second);utc+=Date.parse(date+'T00:00:00Z')-displayed;}return utc;}
function beijingMinutes(t){const parts=new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Shanghai',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).formatToParts(new Date(t));const o=Object.fromEntries(parts.map(p=>[p.type,p.value]));return +o.hour*60+(+o.minute);}
function avoidQuietHours(task){
 const start=60,end=8*60;
 const anchors=[task.time,task.gameTime,task.deadline,task.eventTime].filter(Boolean);
 const blocked=anchors.filter(t=>beijingMinutes(t)>=start&&beijingMinutes(t)<end);
 if(!blocked.length)return task;
 const previousEvening=blocked.map(t=>new Date(new Date(dateKey(t)+'T00:00:00+08:00').getTime()-30*60000).toISOString()).sort()[0];
 if(new Date(previousEvening)>=new Date(task.time))return task;
 return {...task,originalTime:task.time,time:previousEvening,movedForQuietHours:true,detail:(task.detail||'')+' 北京时间 01:00–08:00 无法操作，检查已前移至 '+fmt(previousEvening,{month:'numeric',day:'numeric'})+' 23:30；原事件或截止时间不变。'};
}
function allTasks(){const tasks=[],seen=new Set();for(const l of DATA.leagues)for(const f of DATA.fixtures.filter(f=>f.sport===l.sport&&f.time)){
 const players=matches(f,l);if(!players.length)continue;
 tasks.push({id:`check-${l.id}-${f.id}`,league:l.id,time:plus(f.time,-3600000),title:`赛前检查 · ${f.away} @ ${f.home}`,kind:'建议检查',detail:`${clock(f.time)} 开赛。核对首发、替补及伤停；阵容以平台实际状态为准。`,players:players.map(p=>p.name),gameTime:f.time});
 if(l.transactionMode==='daily-tomorrow'){
 const pd=dateKey(f.time,'America/Los_Angeles'),key=`plan-${l.id}-${pd}`;
 if(!seen.has(key)){seen.add(key);const deadline=new Date(pacificMidnight(pd)-60000).toISOString();tasks.push({id:key,league:l.id,time:plus(deadline,-59*60000),title:'次日补人准备 · Daily–Tomorrow',kind:'提前准备',detail:`美西 ${pd} 比赛日：若需补人，先检查名额和生效日。常规交易截止为北京时间 ${fmt(deadline,{month:'numeric',day:'numeric'})} ${clock(deadline)}（前夜 23:59 PT）；waiver 按联盟设置另算。`,players:[],deadline});}
 }
 }
 const drafts=(DATA.drafts||[]).map(d=>({id:'draft-'+d.id,league:'nba-drafts',time:plus(d.start,-30*60000),eventTime:d.start,title:d.name+' · '+d.format,kind:'选秀准备',detail:fmt(d.start,{month:'numeric',day:'numeric'})+' '+clock(d.start)+' 开始。'+d.note,players:[],unlimited:d.format.includes('不限时')}));
 return [...tasks,...drafts,...saved.custom].map(avoidQuietHours).sort((a,b)=>new Date(a.time)-new Date(b.time));}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(saved));return true;}catch{toast('浏览器无法保存，本次勾选仅在当前页面有效。');return false;}}
function toast(msg){$('toast').textContent=msg;clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('toast').textContent='',5000);}
function dateGroup(items,renderItem){let previous='';return items.map(item=>{const key=item.time?dateKey(item.time):'unknown';let head='';if(key!==previous){previous=key;head=`<div class="date-head"><b>${item.time?esc(dayLabel(item.time)):'截图中已赛 · 开赛时间未收录'}</b></div>`;}return head+renderItem(item);}).join('');}
function notesHTML(ls){const ids=ls.map(l=>l.id);return `<aside class="panel"><div class="eyebrow">ROSTER WATCH</div><h3 style="margin-top:8px">留意这些位置</h3>${DATA.notes.filter(n=>ids.includes(n.league)).map(n=>`<div class="note"><span class="tag">${esc(title(league(n.league)))}</span><b>${esc(n.title)}</b><span class="muted">${esc(n.detail)}</span></div>`).join('')}<p class="sidenote">名单位置和伤停标记均为截图快照。空位也可能是当日赛程安排，不代表需要立即加人。</p></aside>`;}
function taskHTML(t){
 const done=!!saved.done[t.id],near=!done&&new Date(t.time)<=new Date(+now+2*3600000),event=t.gameTime||t.eventTime||t.deadline;
 const eventLabel=t.eventTime?'开选':t.gameTime?'开赛':'交易截止';
 const eventText=event?fmt(event,{month:'numeric',day:'numeric'})+' '+clock(event)+' '+eventLabel:'';
 return '<article class="row task-row '+(done?'done ':'')+(near?'time-critical ':'')+(t.eventTime?'draft-row':'')+'"><div class="time">'+clock(t.time)+'<small>'+esc(countdown(t.time))+'</small></div><div class="task-main"><div class="task-top"><span class="tag">'+esc(title(league(t.league)))+'</span><h3>'+esc(t.title)+'</h3>'+(t.movedForQuietHours?'<span class="tag warn">睡前提前处理</span>':'')+'</div><div class="task-brief">'+(eventText?'<b>'+esc(eventText)+'</b>':'')+(t.players?.length?'<span>'+t.players.length+' 人 · '+t.players.slice(0,3).map(esc).join(' / ')+(t.players.length>3?' …':'')+'</span>':'')+(t.unlimited?'<span class="tag">不限时 · 结束时间待确认</span>':'')+'</div><details><summary>展开详情'+(t.players?.length?' / 完整名单':'')+'</summary><p>'+esc(t.detail||'自定义操作提醒')+'</p>'+(t.players?.length?'<p>涉及：'+t.players.map(esc).join('、')+'</p>':'')+(t.kind==='自定义'?'<button data-delete="'+esc(t.id)+'" class="small">删除待办</button>':'')+'</details></div><label class="mark"><input type="checkbox" data-done="'+esc(t.id)+'" '+(done?'checked':'')+'>已检查</label></article>';
}
function renderTasks(ls){const ids=ls.map(l=>l.id);visibleTasks=allTasks().filter(t=>ids.includes(t.league)&&timeFilter(t.time)&&(!$('pending').checked||!saved.done[t.id])&&searchMatch([t.title,t.detail,...t.players||[],title(league(t.league))].join(' ')));$('count').textContent=visibleTasks.length+' 项 · 夜间操作前移至前晚 23:30';$('content').innerHTML='<section class="task-list">'+(visibleTasks.length?dateGroup(visibleTasks,taskHTML):'<div class="empty">这个筛选下没有待办。可以更换时间范围或添加提醒。</div>')+'</section><details class="roster-watch"><summary>名单注意事项 / 空位 / 伤停快照</summary>'+notesHTML(ls)+'</details>';}

function renderSchedule(ls){const fixtures=DATA.fixtures.map(f=>({...f,related:ls.filter(l=>l.sport===f.sport).map(l=>({l,players:matches(f,l)}))})).filter(f=>f.related.length&&(!$('own').checked||f.related.some(r=>r.players.length))&&timeFilter(f.time)&&searchMatch([f.sport,f.home,f.away,...f.related.flatMap(r=>r.players.map(p=>p.name))].join(' '))).sort((a,b)=>(a.time?new Date(a.time).getTime():0)-(b.time?new Date(b.time).getTime():0));$('count').textContent=`${fixtures.length} 场 · EPL 相同比赛合并显示`;$('content').innerHTML=dateGroup(fixtures,f=>`<article class="row"><div class="time">${f.time?clock(f.time):'已赛'}<small>${f.time?esc(countdown(f.time)):'截图时状态'}</small></div><div><div class="meta"><span class="tag">${f.sport}</span><span class="source">${f.time?'开赛时间':'非实时比分'}</span></div><h3 style="margin-top:7px">${esc(f.away)} <span class="muted">@</span> ${esc(f.home)}</h3>${f.related.filter(r=>!$('own').checked||r.players.length).map(r=>`<div class="small" style="margin-top:9px"><b>${esc(r.l.platform)}</b>${r.l.priority==='primary'?' · 主力 League':''}<div class="player-list">${r.players.length?r.players.map(p=>`<span class="player-chip">${esc(p.name)} <span class="muted">${esc(p.slot)}${p.status?' · '+esc(p.status):''}</span></span>`).join(''):'<span class="muted">无我的球员</span>'}</div></div>`).join('')}<p class="source">来源：${f.source.startsWith('https:')?`<a href="${esc(f.source)}" target="_blank" rel="noopener">NHL 官方赛程</a>`:esc(f.source)}</p></div><span class="tag">${f.time?'已收录':'历史快照'}</span></article>`)||'<div class="empty">这个筛选下没有收录的比赛。<br>不代表没有比赛；请查看上方赛程覆盖范围。</div>';}
function renderRoster(ls){if(ls.length===1&&ls[0].draftOnly){$('count').textContent='NBA 名单稍后补充';$('content').innerHTML='<div class="empty">已记录 3 场选秀，见“操作提醒”。NBA 球员名单和比赛赛程暂未加入。</div>';return;}ls=ls.filter(l=>!l.draftOnly);let total=0;$('content').innerHTML='<div class="roster-grid">'+ls.map(l=>{const players=l.players.filter(p=>searchMatch([p.name,p.team,p.pos,p.slot,p.status].join(' ')));total+=players.length;if(!players.length)return '';return `<section class="panel"><div class="eyebrow">${l.priority==='primary'?'PRIMARY LEAGUE':'ROSTER SNAPSHOT'} · ${l.rosterSnapshotDate}</div><h3 style="margin-top:8px">${esc(title(l))}<span class="tag">${players.length} / ${l.players.length}</span></h3><table><thead><tr><th>球员 / 球队单位</th><th>队伍</th><th>位置</th><th>名单状态</th></tr></thead><tbody>${players.map(p=>`<tr><td>${esc(p.name)}</td><td>${esc(p.team)}</td><td>${esc(p.pos)}</td><td>${esc(p.slot)} ${p.status?`<span class="tag ${p.status==='BYE'?'':'bad'}">${esc(p.status)}</span>`:''}</td></tr>`).join('')}</tbody></table><p class="source">${l.id==='epl-sleeper'?'沿用 test 对话；首发席位和位置资格待核实。':'位置和状态按截图录入；不会自动跟随平台变化。'}</p><a class="small" href="${l.platformUrl}" target="_blank" rel="noopener">打开 ${l.platform} 平台 ↗</a></section>`;}).join('')+'</div>';$('count').textContent=`${total} 个名单项 · 首发 / 替补 / IR 为截图状态`;if(!total)$('content').innerHTML='<div class="empty">没有匹配的名单项。</div>';}
function renderGuide(ls){$('count').textContent='交易生效时间、首发锁定、waiver 分开管理';$('content').innerHTML='<div class="guide-grid">'+ls.filter(l=>searchMatch(title(l)+' '+l.transactionMode+' waiver 锁定 阵容')).map(l=>l.draftOnly?`<section class="panel"><h3>NBA 选秀</h3><p>选秀前 30 分钟开始准备，页面保留实际开选时间。</p>${DATA.drafts.map(d=>`<p class="small"><b>${esc(d.name)}</b> · ${fmt(d.start,{month:'numeric',day:'numeric'})} ${clock(d.start)} · ${esc(d.format)}</p>`).join('')}<p class="small muted">tuesday盟不限时，不假定结束时间。NBA 比赛赛程及第四个 league 后续补充。</p></section>`:`<section class="panel"><div class="eyebrow">${l.transactionMode==='realtime'?'MATCHDAY CHECK':'PLAN AHEAD'}</div><h3 style="margin-top:8px">${esc(title(l))}</h3>${l.transactionMode==='realtime'?`<ol><li>赛前查看确认首发、伤停和替补覆盖。</li><li>建议开赛前 60 分钟开始检查，开赛前完成调整；球员实时锁定以平台显示为准。</li><li>若球员不首发，检查仍未开赛的可替换球员及位置资格。</li><li>完成后在本页勾选“已检查”。</li></ol>`:`<ol><li>提前检查下一比赛日的赛程、空位、轮休及可用名额。</li><li>按你提供的 Daily–Tomorrow 设置：常规交易在美西前夜 23:59 前完成，次日生效。日历按美西时区自动换算，不固定写死北京时间。</li><li>已有球员的首发／替补调整，通常仍在各自开赛时锁定；赛前再检查一次。</li><li>${l.sport==='NHL'?'检查门将是否确认首发，并按剩余添加次数安排补人。':'检查 Q / IR / BYE；为晚场不确定球员预留可替换人选。'}</li></ol>`}<p><span class="tag warn">Waiver 处理时间待补充</span></p><p class="small muted">Daily–Tomorrow 不等于 waiver 自动到账时间。联盟专属的处理日、竞价截止与交易限制，补充设置后才能精确提醒。</p><a class="small" href="${l.platformUrl}" target="_blank" rel="noopener">打开平台 ↗</a></section>`).join('')+`<section class="panel"><h3>提醒如何使用</h3><ol><li>比赛默认提前 60 分钟检查，选秀提前 30 分钟准备。若提醒或开赛／截止落在北京时间 01:00–08:00，前移至前晚 23:30；08:00 开赛的检查也因原提醒为 07:00 而前移。实际开赛／截止不变。睡前设好阵容、替补预案或选秀队列，夜间无需回来操作。</li><li>勾选仅记录你已检查，不会更改 Yahoo、Sleeper 或 Fantrax 阵容。</li><li>“导出日历提醒”导出当前筛选中未完成、尚未到时间的任务；日历事件前 15 分钟触发提醒；若落入 01:00–08:00，则改在可操作的事件时间提醒。提醒效果取决于日历应用设置。</li><li>页面关闭后不会推送。名单与赛程需更新；覆盖期结束会提示补充数据。</li></ol></section><section class="panel"><h3>数据范围与依据</h3><p class="small">${Object.entries(DATA.coverage).map(([s,v])=>`${s}：${esc(v)}`).join('<br>')}</p><p class="small"><a href="${DATA.sources.yahoo}" target="_blank" rel="noopener">Yahoo 交易与阵容截止说明</a><br><a href="${DATA.sources.lineup}" target="_blank" rel="noopener">Yahoo 首发／替补管理说明</a><br><a href="${DATA.sources.nhl}" target="_blank" rel="noopener">NHL 官方赛程快照</a></p><p class="source">部分截图未显示完整队名：NCAAF 的 Kromah、Robinson（FSU）、Williams（NW）、NFL 的 Gainwell（TB）及 NHL 的 Dorofeyev（NYR）按截图对阵推断，待核实。Sleeper 平台位置资格待核实；NHL 部分位置仅为截图槽位，Wilson 仅显示 UTIL。</p></section></div>`;}
function render(){document.body.dataset.view=tab;now=new Date();$('clock').textContent=fmt(now,{month:'2-digit',day:'2-digit',weekday:'short',hour:'2-digit',minute:'2-digit',hour12:false})+' 北京时间';const ls=selectedLeagues();$('leagues').innerHTML=LEAGUES.map(l=>`<button class="league-card" data-league="${l.id}" aria-pressed="${activeLeague===l.id}"><div class="eyebrow">${l.draftOnly?'DRAFT CALENDAR':esc(l.platform)}</div><div class="name">${l.sport}${l.priority==='primary'?'<span class="pill">主力</span>':''}</div><small>${l.draftOnly?'3 场选秀 · 点击筛选':l.players.length+' 个名单项 · '+(l.transactionMode==='realtime'?'实时操作':'Daily–Tomorrow')}</small></button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));$('heading').textContent={tasks:'下一步，做什么。',schedule:'每一场，与你有关。',roster:'你的五份名单。',guide:'每个 League，怎么操作。'}[tab];$('own-label').hidden=tab!=='schedule';$('pending-label').hidden=tab!=='tasks';$('range').disabled=tab==='roster'||tab==='guide';const sports=[...new Set(ls.map(l=>l.sport))];const max=DATA.fixtures.filter(f=>sports.includes(f.sport)&&f.time).reduce((m,f)=>Math.max(m,new Date(f.time)),0);$('coverage').innerHTML=`<strong>${max&&now>max?'当前收录赛程已过期，请补充新一轮数据。':'赛程覆盖 · 当前轮次快照'}</strong><br>${sports.map(s=>`${s}：${esc(DATA.coverage[s]||'仅记录 3 场选秀，比赛赛程暂缓')}`).join('　 /　 ')||'没有选中的 League'}<br>仅展示已收录赛程；无数据不代表无比赛。伤停与名单位置以截图时为准。`;if(tab==='tasks')$('coverage').innerHTML='<b>01:00–08:00 无法操作</b> · 相关检查统一前移至前晚 <b>23:30</b>，保留 90 分钟余量。比赛／选秀实际开始时间见每行。<details><summary>赛程覆盖范围</summary>'+sports.map(s=>s+'：'+esc(DATA.coverage[s]||'仅选秀')).join(' / ')+'；数据为快照，不自动更新。</details>';({tasks:renderTasks,schedule:renderSchedule,roster:renderRoster,guide:renderGuide}[tab])(ls);}
document.addEventListener('click',e=>{const b=e.target.closest('[data-league],[data-tab],[data-delete]');if(!b)return;if(b.dataset.league){activeLeague=activeLeague===b.dataset.league?'all':b.dataset.league;render();}else if(b.dataset.tab){tab=b.dataset.tab;render();}else if(b.dataset.delete){saved.custom=saved.custom.filter(t=>t.id!==b.dataset.delete);delete saved.done[b.dataset.delete];persist();render();}});
document.addEventListener('change',e=>{if(e.target.dataset.done){saved.done[e.target.dataset.done]=e.target.checked;persist();render();}});
for(const id of ['range','platform','own','pending'])$(id).addEventListener('change',render);$('search').addEventListener('input',render);
$('clear').onclick=()=>{activeLeague='all';$('range').value='all';$('platform').value='all';$('search').value='';$('own').checked=true;$('pending').checked=true;render();};
$('task-league').innerHTML=LEAGUES.map(l=>`<option value="${l.id}">${esc(title(l))}</option>`).join('');
$('add').onclick=()=>{if(activeLeague!=='all')$('task-league').value=activeLeague;$('task-dialog').showModal();};$('cancel').onclick=()=>$('task-dialog').close();
$('task-form').onsubmit=e=>{e.preventDefault();const taskTime=new Date($('task-time').value+':00+08:00');if(!Number.isFinite(+taskTime))return;const text=$('task-title').value.trim();if(!text){$('task-title').setCustomValidity('请输入待办内容');$('task-title').reportValidity();return;}saved.custom.push({id:'custom-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),league:$('task-league').value,time:taskTime.toISOString(),title:text,kind:'自定义',players:[]});const ok=persist();$('task-dialog').close();$('task-form').reset();tab='tasks';activeLeague='all';$('platform').value='all';$('range').value='all';$('search').value='';render();if(ok)toast('提醒已保存到当前浏览器。');};$('task-title').oninput=()=>$('task-title').setCustomValidity('');
const icsEscape=s=>String(s).replace(/\\/g,'\\\\').replace(/\r?\n/g,'\\n').replace(/;/g,'\\;').replace(/,/g,'\\,');
function foldLine(s){let out='',line='',bytes=0;for(const c of s){const size=new TextEncoder().encode(c).length;if(bytes+size>73){out+=line+'\r\n';line=' ';bytes=1;}line+=c;bytes+=size;}return out+line;}
const icsDate=d=>new Date(d).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}Z/,'Z');
function calendarAlarm(time){const minutes=beijingMinutes(plus(time,-15*60000));return minutes>=60&&minutes<480?'TRIGGER:PT0M':'TRIGGER:-PT15M';}
$('export').onclick=()=>{const ids=selectedLeagues().map(l=>l.id);const items=allTasks().filter(t=>ids.includes(t.league)&&!saved.done[t.id]&&new Date(t.time)>new Date()&&timeFilter(t.time)&&searchMatch([t.title,t.detail,...t.players||[],title(league(t.league))].join(' ')));if(!items.length){toast('当前筛选下没有尚未到时间的待办可导出。');return;}const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//LeagueDesk//Personal Manual//ZH','CALSCALE:GREGORIAN','METHOD:PUBLISH'];for(const t of items)lines.push('BEGIN:VEVENT','UID:'+t.id+'@league-desk','DTSTAMP:'+icsDate(new Date()),'DTSTART:'+icsDate(t.time),'DTEND:'+icsDate(plus(t.time,15*60000)),'SUMMARY:'+icsEscape(title(league(t.league))+' · '+t.title),'DESCRIPTION:'+icsEscape((t.detail||'')+'\n'+(t.players||[]).join('、')+'\n名单及赛程为 2026-10-10 快照；临场以平台为准。'),'BEGIN:VALARM',calendarAlarm(t.time),'ACTION:DISPLAY','DESCRIPTION:League 操作提醒','END:VALARM','END:VEVENT');lines.push('END:VCALENDAR');const url=URL.createObjectURL(new Blob([lines.map(foldLine).join('\r\n')+'\r\n'],{type:'text/calendar;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download='league-reminders.ics';a.click();setTimeout(()=>URL.revokeObjectURL(url),5000);toast(`已导出 ${items.length} 项，请导入日历应用以启用提醒。`);};
render();setInterval(()=>{if(!document.querySelector('dialog[open]')&&!document.querySelector('details[open]'))render();},60000);
</script>
</body></html>
